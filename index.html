<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: min(92%, 500px);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .status {
      color: #999;
      margin-bottom: 40px;
    }

    .mic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 45px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .mic:active {
      transform: scale(0.94);
    }

    .mic.listening {
      background: #ff3b30;
      color: white;
      animation: pulse 1.2s infinite;
    }

    .conversation {
      margin-top: 45px;
      text-align: left;
    }

    .message {
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.5;
    }

    .user {
      background: #22232a;
    }

    .ai {
      background: #15161b;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6);
      }

      70% {
        box-shadow: 0 0 0 25px rgba(255, 59, 48, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>Voice AI</h1>

    <div class="status" id="status">
      Tap the microphone and speak
    </div>

    <button class="mic" id="micButton">
      🎙️
    </button>

    <section class="conversation" id="conversation"></section>

  </main>

  <script>

    const micButton = document.getElementById("micButton");
    const status = document.getElementById("status");
    const conversation = document.getElementById("conversation");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      status.textContent =
        "Speech recognition is not supported in this browser.";
    }

    const recognition = SpeechRecognition
      ? new SpeechRecognition()
      : null;

    if (recognition) {

      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;

      micButton.addEventListener("click", () => {

        recognition.start();

        micButton.classList.add("listening");

        status.textContent = "Listening...";
      });

      recognition.onresult = (event) => {

        const transcript =
          event.results[0][0].transcript;

        addMessage(transcript, "user");

        status.textContent = "You said: " + transcript;

        /*
          AI CONNECTION WILL GO HERE.
        */

        setTimeout(() => {

          const response =
            "I heard you say: " + transcript;

          addMessage(response, "ai");

          speak(response);

          status.textContent =
            "Tap the microphone and speak again.";

        }, 500);
      };

      recognition.onerror = () => {

        status.textContent =
          "Something went wrong. Try again.";

      };

      recognition.onend = () => {

        micButton.classList.remove("listening");

      };
    }

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      conversation.appendChild(message);

    }

    function speak(text) {

      const speech =
        new SpeechSynthesisUtterance(text);

      speech.lang = "en-US";

      window.speechSynthesis.speak(speech);

    }

  </script>

</body>
</html>
